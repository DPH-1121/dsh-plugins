name: 校验

# 每次 push / PR 都跑，**完全不需要联网**。
#
# ★ 为什么可以完全不联网
#   上一版（插件市场）必须联网：那时要在干净 runner 上装一遍真实的 harness，
#   才能对着它判定「这个插件能不能装」。这一版不做任何判定 ——
#   面板只负责展示搜集结果，所以校验可以退化成纯粹的本仓库自洽检查：
#     ① 索引自洽（顺序、计数、序列化往返）
#     ② 包内快照是索引的稳定投影
#     ③ --check 是只读的（跑完工作区必须一个字节都没变）
#     ④ 清单满足跨版本装载的不变量（无 peer、无 engines.dsh、exports 齐全…）
#     ⑤ 客户端半仍然是能加载的 classic script
#
#   不联网的校验才有人看：慢的、会随机红的检查，很快就会被忽略。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 自洽与适配不变量
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 准备 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.19'

      - name: 全部测试（含索引自洽校验，只读、不联网）
        run: node test/run.mjs

      - name: ★ 索引与包内快照必须是同一次生成物
        run: |
          set -euo pipefail
          # snapshot.json 是 index.json 的稳定投影，两者必须同步。
          # --check 会逐字节比对「由当前索引重新生成的快照」与磁盘上那一份。
          node scripts/collect.mjs --check
          if ! git diff --quiet; then
            echo "::error::校验过程改动了工作区 —— --check 必须是只读的。"
            git --no-pager diff --stat
            exit 1
          fi

      - name: 数据文件体积上限（它们会被面板整份取走）
        run: |
          set -euo pipefail
          idx=$(stat -c%s catalog/index.json)
          snap=$(stat -c%s catalog/snapshot.json)
          echo "index.json = $idx 字节，snapshot.json = $snap 字节"
          # 上限 16MB：这个文件是**数据**，不是发给浏览器的 payload ——
          # 面板实际收到的是服务器半裁过的列式投影（约 1.6MB JSON / 700KB gzip）。
          # 16MB 是「采集面失控」的警报线，不是精确预算：目录已到一万五千个项目，
          # 旧线（12MB）在 2026-10 就被正常的覆盖面增长顶穿了。
          if [ "$idx" -gt 16000000 ]; then
            echo "::error::catalog/index.json 超过 16MB —— 采集面失控了，请先收窄采集范围。"
            exit 1
          fi
          if [ "$snap" -gt 16000000 ]; then
            echo "::error::catalog/snapshot.json 超过 16MB —— 完整离线目录仍需控制体积。"
            exit 1
          fi

      - name: 仓库根必须是一个可直接安装的插件包
        run: |
          set -euo pipefail
          # 官方桌面版的安装规格解析器只接受 host/owner/repo，
          # 仓库子目录会被拒绝 —— 所以插件必须在根上。
          for f in package.json cordis.patch.yml src/server/index.js src/client/app.js; do
            if [ ! -e "$f" ]; then
              echo "::error::仓库根缺少 $f —— 桌面版将无法从这个仓库安装插件。"
              exit 1
            fi
          done
          if [ -e plugins-src ]; then
            echo "::error::plugins-src/ 是旧结构（插件曾放在子目录里），已废弃。"
            exit 1
          fi
          echo "仓库根就是一个完整的插件包。"
